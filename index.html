<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Tycoon</title>
<meta name="description" content="Run a five-department private college: corporate training, academics, marketing, STEM outreach and vocational education.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🏛️</text></svg>">
<link rel="stylesheet" href="css/game.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand">🏛️ <span data-i18n="app.title">College Tycoon</span><small data-i18n="app.sub">five-department campus sim</small></div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="campus-frame">
    <canvas id="campus"></canvas>
    <div class="campus-tip" id="campusTip" hidden></div>
    <div class="campus-hint" data-i18n="map.hint"></div>
  </div>

  <main>
    <section class="depts" id="depts"></section>

    <aside class="side">
      <div class="panel" id="reportPanel"></div>
      <div class="panel">
        <h4 data-i18n="panel.trend"></h4>
        <canvas id="chart"></canvas>
        <div class="legend">
          <span><i style="background:#2fd4d4"></i><b data-i18n="legend.cash"></b></span>
          <span><i style="background:#3b82f6"></i><b data-i18n="legend.learners"></b></span>
          <span><i style="background:#fbbf24"></i><b data-i18n="legend.rep"></b></span>
        </div>
      </div>
      <div class="panel" id="objPanel"></div>
      <div class="panel news" id="newsPanel"></div>
    </aside>
  </main>

  <p class="foot-note" data-i18n="app.footnote"></p>

  <footer class="controls">
    <button id="nextBtn" class="btn-primary" data-i18n="ctrl.next"></button>
    <button id="autoBtn" data-i18n="ctrl.auto"></button>
    <span class="hint" data-i18n="ctrl.spaceHint"></span>
    <span class="spacer"></span>
    <button id="saveBtn" class="btn-ghost" data-i18n="ctrl.save"></button>
    <button id="loadBtn" class="btn-ghost" data-i18n="ctrl.load"></button>
    <button id="helpBtn" class="btn-ghost" data-i18n="ctrl.help"></button>
    <button id="fsBtn" class="btn-ghost" data-i18n="ctrl.fullscreen"></button>
    <button id="langBtn" class="btn-ghost">中文</button>
    <button id="restartBtn" class="btn-ghost" data-i18n="ctrl.restart"></button>
  </footer>

</div>

<!-- start screen -->
<div class="overlay" id="startOverlay">
  <div class="card">
    <button id="langBtnStart" class="btn-ghost lang-pick"></button>
    <h2>🏛️ <span data-i18n="app.title"></span></h2>
    <p class="sub" data-i18n="start.tagline"></p>
    <p data-i18n-html="start.body"></p>
    <div class="lineup" id="lineup"></div>
    <div class="diffs" id="diffList"></div>
    <button id="newGameBtn" class="btn-primary" style="width:100%;padding:11px" data-i18n="start.begin"></button>
    <button id="continueBtn" class="btn-ghost" style="width:100%;margin-top:9px;padding:10px" data-i18n="start.continue" hidden></button>
  </div>
</div>

<!-- event modal -->
<div class="overlay" id="eventOverlay" hidden>
  <div class="card" id="eventBody"></div>
</div>

<!-- end-of-game modal -->
<div class="overlay" id="endOverlay" hidden>
  <div class="card" id="endBody"></div>
</div>

<!-- help modal -->
<div class="overlay" id="helpOverlay" hidden>
  <div class="card">
    <h2 data-i18n="help.title"></h2>
    <p class="sub" data-i18n="help.sub"></p>
    <ul class="rules">
      <li data-i18n-html="help.1"></li>
      <li data-i18n-html="help.2"></li>
      <li data-i18n-html="help.3"></li>
      <li data-i18n-html="help.4"></li>
      <li data-i18n-html="help.5"></li>
      <li data-i18n-html="help.6"></li>
      <li data-i18n-html="help.7"></li>
      <li data-i18n-html="help.8"></li>
    </ul>
    <button id="helpCloseBtn" class="btn-primary" style="width:100%;margin-top:14px;padding:10px" data-i18n="help.close"></button>
  </div>
</div>

<div id="toast"></div>

<script src="js/util.js"></script>
<script src="js/i18n.js"></script>
<script src="js/sprites.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/campus.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
